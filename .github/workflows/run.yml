name: jp-news-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch: {}

concurrency:
  group: jp-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '4' }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "jp-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git pull --rebase -X ours && git push)
