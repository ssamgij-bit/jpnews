name: seoul-weather

on:
  schedule:
    # 06:30 KST 발송은 '이어 달리기'(실행이 다음 실행을 직접 띄움)로 맞춤. GitHub 예약 실행은 몇 시간씩 밀려서
    # 시각을 맞추는 데 쓰지 않고, 이어 달리기가 끊겼을 때 다시 잇는 용도로만 하루 몇 번 걸어 둠.
    - cron: "17 3,9,15 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "1이면 시각·중복 확인 없이 바로 발송"
        required: false
        default: ""

concurrency:
  group: seoul-weather${{ github.event.inputs.force == '1' && '-force' || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send Seoul weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event.inputs.force }}
        run: python weather.py
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add weather_state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "weather state [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep $((i * 5)); done
          exit 1

      - name: 다음 실행 이어 붙이기
        if: ${{ !cancelled() && github.event.inputs.force != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이미 대기 중이거나 실행 중인 다른 날씨 실행이 있으면 건너뜀(이어 달리기가 둘로 갈라지지 않게)
          n=$(gh run list -R "${{ github.repository }}" --workflow weather.yml --limit 20 --json status,databaseId \
               -q '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting") and .databaseId != ${{ github.run_id }})] | length')
          if [ "${n:-0}" = "0" ]; then gh workflow run weather.yml -R "${{ github.repository }}" --ref main && echo "다음 실행 요청"; else echo "다른 실행 $n개 있음 → 건너뜀"; fi
